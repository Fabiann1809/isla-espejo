<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Mando - Isla Espejo</title>
<style>
  :root { --gutter: 16px; --bg: #14181f; --fg: #e8ecf1; --accent: #4cc9a0; --btn: #2a3340; --btn-on: #4cc9a0; }
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
    font-family: system-ui, sans-serif; touch-action: none; overscroll-behavior: none; }
  #app { height: 100%; width: 100%; padding: var(--gutter); display: flex; flex-direction: column; }
  #status { text-align: center; font-size: 16px; padding: 4px 0 8px; min-height: 28px; }
  #status.ok { color: var(--accent); }
  #status.bad { color: #ff8a80; }
  #pad { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: space-between; gap: var(--gutter); }
  #stick { position: relative; flex: none; width: min(42vw, 44vh, 220px); aspect-ratio: 1; border-radius: 50%;
    background: #1f2630; border: 2px solid #3a4656; touch-action: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 42%; height: 42%; margin: -21% 0 0 -21%; border-radius: 50%;
    background: #55657a; border: 2px solid #8fa3bb; pointer-events: none; }
  #buttons { flex: 1; min-width: 0; max-width: 360px; display: grid; gap: 10px;
    grid-template-columns: repeat(3, 1fr); grid-auto-rows: minmax(56px, 1fr); max-height: 100%; }
  .btn { touch-action: none; border: 2px solid #44536a; border-radius: 14px; background: var(--btn); color: var(--fg);
    font-size: 15px; font-weight: 600; padding: 4px; min-height: 56px; }
  .btn.on { background: var(--btn-on); color: #0b1a14; }
  #b-attack { grid-column: 1 / 3; }
  #b-dash { grid-column: 3; }
  #b-interact { grid-column: 1 / 4; }
</style>
</head>
<body>
<div id="app">
  <div id="status" role="status" aria-live="polite">Esperando...</div>
  <div id="pad">
    <div id="stick"><div id="knob"></div></div>
    <div id="buttons">
      <button class="btn" id="b-attack" data-action="attack">Atacar</button>
      <button class="btn" id="b-dash" data-action="dash">Esquivar</button>
      <button class="btn" data-action="skill_1">Habilidad 1</button>
      <button class="btn" data-action="skill_2">Habilidad 2</button>
      <button class="btn" data-action="skill_3">Habilidad 3</button>
      <button class="btn" id="b-interact" data-action="interact">Interactuar</button>
    </div>
  </div>
</div>
<script>
(function () {
  "use strict";
  var MOVE_INTERVAL_MS = 50, PING_INTERVAL_MS = 1000, RETRY_MS = 2000;
  var statusEl = document.getElementById("status");
  var ws = null, pingTimer = null, retryTimer = null, busy = false;

  function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = cls || ""; }
  function send(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) { ws.send(JSON.stringify(obj)); return true; }
    return false;
  }

  // ---- Joystick ----
  var stick = document.getElementById("stick"), knob = document.getElementById("knob");
  var stickId = null, curX = 0, curY = 0, sentX = 0, sentY = 0, lastMoveAt = 0, moveTimer = null;

  function flushMove() {
    moveTimer = null;
    if (curX === sentX && curY === sentY) return;
    if (send({ type: "move", x: curX, y: curY })) { sentX = curX; sentY = curY; }
    lastMoveAt = Date.now();
  }
  function queueMove() {
    if (moveTimer !== null) return;
    var wait = MOVE_INTERVAL_MS - (Date.now() - lastMoveAt);
    if (wait <= 0) flushMove(); else moveTimer = setTimeout(flushMove, wait);
  }
  function drawKnob() {
    var r = stick.clientWidth / 2;
    knob.style.transform = "translate(" + (curX * r * 0.58) + "px," + (curY * r * 0.58) + "px)";
  }
  function stickFromEvent(e) {
    var b = stick.getBoundingClientRect(), r = b.width / 2;
    var dx = (e.clientX - (b.left + r)) / r, dy = (e.clientY - (b.top + r)) / r;
    var len = Math.sqrt(dx * dx + dy * dy);
    if (len > 1) { dx /= len; dy /= len; }
    curX = Math.round(dx * 100) / 100; curY = Math.round(dy * 100) / 100;
    drawKnob(); queueMove();
  }
  function releaseStick() {
    stickId = null; curX = 0; curY = 0;
    if (moveTimer !== null) { clearTimeout(moveTimer); moveTimer = null; }
    drawKnob();
    send({ type: "move", x: 0, y: 0 }); // if the socket is closed the server stops on its own
    sentX = 0; sentY = 0; lastMoveAt = Date.now();
  }
  stick.addEventListener("pointerdown", function (e) {
    if (stickId !== null) return;
    stickId = e.pointerId;
    try { stick.setPointerCapture(e.pointerId); } catch (_) {}
    stickFromEvent(e); e.preventDefault();
  });
  stick.addEventListener("pointermove", function (e) { if (e.pointerId === stickId) { stickFromEvent(e); e.preventDefault(); } });
  ["pointerup", "pointercancel", "lostpointercapture"].forEach(function (n) {
    stick.addEventListener(n, function (e) { if (e.pointerId === stickId) releaseStick(); });
  });

  // ---- Buttons ----
  var held = {}; // action name -> {el, pointerId}
  function press(el, e) {
    var name = el.dataset.action;
    if (held[name]) return;
    held[name] = { el: el, pointerId: e.pointerId };
    el.classList.add("on");
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    send({ type: "action", name: name, pressed: true });
  }
  function release(name) {
    var h = held[name];
    if (!h) return;
    delete held[name];
    h.el.classList.remove("on");
    send({ type: "action", name: name, pressed: false });
  }
  Array.prototype.forEach.call(document.querySelectorAll(".btn"), function (el) {
    var name = el.dataset.action;
    el.addEventListener("pointerdown", function (e) { press(el, e); e.preventDefault(); });
    ["pointerup", "pointercancel", "pointerleave", "lostpointercapture"].forEach(function (n) {
      el.addEventListener(n, function (e) {
        if (held[name] && held[name].pointerId === e.pointerId) release(name);
      });
    });
  });

  // Whatever is held is let go when the socket is gone (the server also does this on its side).
  function releaseAll() {
    if (stickId !== null) releaseStick();
    Object.keys(held).forEach(function (n) {
      var h = held[n]; delete held[n]; h.el.classList.remove("on");
    });
  }

  // ---- Connection ----
  function connect() {
    retryTimer = null;
    busy = false;
    setStatus("Esperando...");
    try {
      ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
    } catch (_) { scheduleRetry(); return; }
    var mine = ws;
    mine.onopen = function () {
      setStatus("Conectado", "ok");
      send({ type: "ping" });
      pingTimer = setInterval(function () { send({ type: "ping" }); }, PING_INTERVAL_MS);
    };
    mine.onmessage = function (ev) {
      var m; try { m = JSON.parse(ev.data); } catch (_) { return; }
      if (m && m.type === "busy") { busy = true; setStatus("Mando ocupado", "bad"); }
    };
    mine.onclose = function () {
      if (ws !== mine) return;
      ws = null;
      if (pingTimer !== null) { clearInterval(pingTimer); pingTimer = null; }
      releaseAll();
      if (!busy) setStatus("Desconectado, reconectando...", "bad");
      scheduleRetry();
    };
    mine.onerror = function () { /* onclose follows */ };
  }
  function scheduleRetry() { if (retryTimer === null) retryTimer = setTimeout(connect, RETRY_MS); }

  // ---- No zoom, no menus ----
  ["gesturestart", "gesturechange", "contextmenu", "selectstart", "dblclick"].forEach(function (n) {
    document.addEventListener(n, function (e) { e.preventDefault(); });
  });
  document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
  window.addEventListener("blur", releaseAll);
  document.addEventListener("visibilitychange", function () { if (document.hidden) releaseAll(); });

  connect();
})();
</script>
</body>
</html>
